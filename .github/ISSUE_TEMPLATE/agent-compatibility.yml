name: Agent 兼容问题
description: 报告 Codex、Claude Code、WorkBuddy 等文件型 Agent 的协议问题
title: "[Agent] "
labels: [agent]
body:
  - type: dropdown
    id: host
    attributes:
      label: Agent 宿主
      options: [Codex, Claude Code, WorkBuddy, Qoder, 其他]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 合成任务与实际行为
      description: 只使用合成内容，说明预期 R0/R1 权限和实际读写范围。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可复现证据
      description: 提供脱敏后的命令、修改文件清单和自检结果。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 证据不包含私人 Vault、凭据、账号信息或绝对路径
          required: true
